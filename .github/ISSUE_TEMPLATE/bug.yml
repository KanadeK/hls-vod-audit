name: Bug report
description: Report reproducible behavior using synthetic input
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include command, synthetic input, expected and actual output. Remove private data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Tool version, Python version and operating system
    validations:
      required: true
